<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05060d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>AutoCaption Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#05060d; --panel:#0b0d1a; --line:#1b1f3a; --text:#e8ecff; --mute:#7c84b3;
  --cyan:#00f0ff; --pink:#ff2bd6; --lime:#b6ff3b; --red:#ff4d6d;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(600px 300px at 90% -5%,rgba(255,43,214,.16),transparent),radial-gradient(600px 300px at 0% 0%,rgba(0,240,255,.14),transparent);
  padding-bottom:40px}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 16px;background:rgba(5,6,13,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px}
.logo b{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#05060d;
  background:linear-gradient(135deg,var(--cyan),var(--pink));box-shadow:0 0 16px rgba(0,240,255,.55)}
.logo h1{font-size:16px;line-height:1.1}
.logo p{font-size:11px;color:var(--mute)}
.btn-api{font:500 12px 'Space Grotesk';color:var(--cyan);background:transparent;border:1px solid var(--cyan);
  padding:7px 12px;border-radius:10px;cursor:pointer;box-shadow:0 0 10px rgba(0,240,255,.35),inset 0 0 8px rgba(0,240,255,.12)}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
label.l{font-size:12px;color:var(--mute)}
input,select{width:100%;background:#060813;color:var(--text);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font:14px 'Space Grotesk',sans-serif;outline:none}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,240,255,.15)}
.row{display:flex;gap:8px}
.row>input{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;cursor:pointer;font:700 13px 'Space Grotesk';color:#05060d;padding:10px 16px;border-radius:10px;
  background:var(--cyan);box-shadow:0 0 14px rgba(0,240,255,.5)}
.btn.pink{background:var(--pink);box-shadow:0 0 14px rgba(255,43,214,.5)}
.btn.main{width:100%;padding:14px;font-size:15px;border-radius:14px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 22px rgba(0,240,255,.35),0 0 30px rgba(255,43,214,.3)}
.btn:disabled{opacity:.6;cursor:wait}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);padding:5px;border:1px solid var(--line);border-radius:14px}
.tabs button{border:0;background:transparent;color:var(--mute);font:500 13px 'Space Grotesk';padding:11px;border-radius:10px;cursor:pointer}
.tabs button.on{color:#05060d;background:var(--cyan);font-weight:700;box-shadow:0 0 16px rgba(0,240,255,.55)}
.drop{display:grid;justify-items:center;gap:4px;border:2px dashed #2a3060;border-radius:14px;padding:22px 12px;cursor:pointer;text-align:center}
.drop:hover{border-color:var(--pink);box-shadow:0 0 16px rgba(255,43,214,.25)}
.drop strong{font-size:13px;color:var(--pink)}
.drop small{font-size:11px;color:var(--mute)}
#statusBox{font-size:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#060813;color:var(--cyan)}
#statusBox.err{color:var(--red);border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.08)}
.player{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;
  border:1px solid var(--cyan);box-shadow:0 0 22px rgba(0,240,255,.25)}
.player video,#ytPlayerContainer,#ytPlayerContainer iframe{width:100%;height:100%}
.ph{padding:20px;text-align:center;color:var(--mute);font-size:12px}
#liveCaptionOverlay{position:absolute;left:10px;right:10px;bottom:38px;text-align:center;pointer-events:none;z-index:20}
#liveCaptionText{display:inline-block;padding:6px 14px;border-radius:10px;font-weight:700;font-size:15px;line-height:1.35;color:#fff;
  background:rgba(0,0,0,.7);border:1px solid rgba(0,240,255,.5);text-shadow:0 0 8px var(--cyan)}
.head{display:flex;justify-content:space-between;align-items:center}
.head h2{font-size:14px}
.head .row button{font:500 12px 'Space Grotesk';color:var(--lime);background:transparent;border:1px solid var(--lime);padding:5px 10px;border-radius:8px;cursor:pointer}
#captionList{max-height:270px;overflow-y:auto;display:grid;gap:6px}
.cap{display:flex;gap:10px;align-items:flex-start;padding:9px;border-radius:10px;background:#060813;border:1px solid var(--line);cursor:pointer}
.cap:hover{border-color:var(--pink)}
.cap span{font:500 11px 'JetBrains Mono',monospace;color:var(--pink);flex-shrink:0;padding-top:2px}
.cap p{font-size:13px;line-height:1.5}
.cap span{white-space:nowrap}
.stats{font:500 12px 'JetBrains Mono',monospace;color:var(--lime);padding:8px 10px;border:1px solid rgba(182,255,59,.35);border-radius:10px;background:rgba(182,255,59,.06)}
.empty{font-size:12px;color:var(--mute)}
footer{text-align:center;font-size:12px;color:var(--mute);padding:6px 16px}
footer a{display:inline-flex;align-items:center;gap:4px;color:var(--cyan);font-weight:700;text-decoration:none;
  padding:4px 10px;border:1px solid var(--cyan);border-radius:999px;margin-left:4px;
  text-shadow:0 0 10px rgba(0,240,255,.7);box-shadow:0 0 12px rgba(0,240,255,.35),inset 0 0 8px rgba(0,240,255,.12);
  animation:nudge 2.4s ease-in-out infinite}
footer a:hover{color:#05060d;background:var(--cyan);text-shadow:none}
footer a:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
@keyframes nudge{0%,100%{box-shadow:0 0 8px rgba(0,240,255,.3)}50%{box-shadow:0 0 18px rgba(0,240,255,.8)}}
@media (prefers-reduced-motion:reduce){footer a{animation:none}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <b>CC</b>
    <div><h1>AutoCaption Studio</h1><p>Multi-language video subtitles</p></div>
  </div>
  <button class="btn-api" onclick="toggleSettings()">🔑 API</button>
</header>

<main>

  <!-- API panel: Google name only appears here after the API button is tapped -->
  <div id="settingsPanel" class="card hidden">
    <label class="l">Google API Key</label>
    <div class="row">
      <input id="apiKeyInput" type="password" placeholder="Paste your Google API key (AIzaSy...)" />
      <button class="btn" onclick="saveApiKey()">Save</button>
    </div>
    <label class="l">Model (auto-fallback on)</label>
    <select id="modelSelect">
      <option value="gemini-3.8-flash">Model 1 · Latest (recommended)</option>
      <option value="gemini-3.5-flash-lite">Model 2 · Fast, high quota</option>
      <option value="gemini-3.6-flash">Model 3 · Balanced</option>
      <option value="gemini-3.1-flash-lite">Model 4 · Lite</option>
      <option value="gemini-3-flash-preview">Model 5 · Preview</option>
    </select>
  </div>

  <div class="tabs">
    <button id="tabLinkBtn" class="on" onclick="switchTab('link')">🔗 Video link</button>
    <button id="tabUploadBtn" onclick="switchTab('upload')">📁 Upload video</button>
  </div>

  <section id="linkSection" class="card">
    <label class="l">YouTube URL or direct video link (.mp4 / .webm)</label>
    <div class="row">
      <input id="videoUrlInput" type="url" placeholder="https://www.youtube.com/watch?v=..." />
      <button class="btn" onclick="loadVideoLink()">Load</button>
    </div>
  </section>

  <section id="uploadSection" class="card hidden">
    <label class="drop">
      <span style="font-size:28px">🎬</span>
      <strong id="fileNameLabel">Tap to choose a video</strong>
      <small>MP4, MOV, WEBM · under 20 MB works best</small>
      <input id="videoFileInput" type="file" accept="video/*,audio/*" class="hidden" onchange="handleFileUpload(event)" />
    </label>
  </section>

  <section class="card">
    <div class="grid2">
      <div>
        <label class="l">🌐 Caption language</label>
        <select id="languageSelect">
          <option value="English|en-US">English</option>
          <option value="Bengali (বাংলা)|bn-BD">Bengali (বাংলা)</option>
          <option value="Hindi (हिन्दी)|hi-IN">Hindi (हिन्दी)</option>
          <option value="Arabic (العربية)|ar-SA">Arabic (العربية)</option>
          <option value="Spanish (Español)|es-ES">Spanish (Español)</option>
          <option value="French (Français)|fr-FR">French (Français)</option>
          <option value="Urdu (اردو)|ur-PK">Urdu (اردو)</option>
          <option value="Japanese (日本語)|ja-JP">Japanese (日本語)</option>
          <option value="Korean (한국어)|ko-KR">Korean (한국어)</option>
          <option value="Portuguese|pt-BR">Portuguese</option>
          <option value="Turkish|tr-TR">Turkish</option>
          <option value="Indonesian|id-ID">Indonesian</option>
        </select>
      </div>
      <div>
        <label class="l">⚡ Caption mode</label>
        <select id="engineSelect">
          <option value="gemini">AI auto-generate</option>
          <option value="speech">Live listen (no key)</option>
        </select>
      </div>
    </div>
    <div>
      <label class="l">✂️ Words per caption line (Premiere Pro ready)</label>
      <select id="chunkSelect" onchange="applyChunking()">
        <option value="0">Original (AI sentences)</option>
        <option value="1">1 word at a time</option>
        <option value="2">2 words</option>
        <option value="3" selected>3 words</option>
        <option value="4">4 words</option>
        <option value="5">5 words</option>
        <option value="6">6 words</option>
        <option value="8">8 words</option>
      </select>
    </div>
    <button id="generateBtn" class="btn main" onclick="startCaptionGeneration()">✨ Generate captions</button>
    <div id="statusBox" class="hidden"></div>
  </section>

  <section class="player">
    <video id="html5Player" controls playsinline class="hidden"></video>
    <div id="ytPlayerContainer" class="hidden"><div id="ytPlayer"></div></div>
    <div id="playerPlaceholder" class="ph">Load a link or upload a video to preview it with live captions.</div>
    <div id="liveCaptionOverlay" class="hidden"><span id="liveCaptionText"></span></div>
  </section>

  <section class="card">
    <div class="head">
      <h2>Generated captions</h2>
      <div class="row">
        <button onclick="copyCaptions()">📋 Copy</button>
        <button onclick="downloadSRT()">⬇ .SRT</button>
      </div>
    </div>
    <div id="captionStats" class="stats hidden"></div>
    <div id="captionList"><p class="empty">Captions appear here. Tap a timestamp to jump to that moment.</p></div>
  </section>

</main>

<footer>Created by <a href="https://shaonfs4-cpu.github.io/shaon/" target="_blank" rel="noopener noreferrer">Shoriful Islam Shaon <span aria-hidden="true">↗</span></a></footer>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  let currentTab = 'link';
  let uploadedFile = null;
  let currentVideoUrl = '';
  let isYouTubeUrl = false;
  let ytPlayerInstance = null;
  let captionsData = [];
  let rawCaptions = [];
  let syncTimer = null;
  let recognition = null;
  let isListening = false;

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    const p = document.getElementById('html5Player');
    p.addEventListener('timeupdate', () => updateActiveCaption(p.currentTime));
  });

  function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('hidden'); }

  function saveApiKey() {
    localStorage.setItem('gemini_api_key', document.getElementById('apiKeyInput').value.trim());
    showStatus('API key saved on your device!', false);
    document.getElementById('settingsPanel').classList.add('hidden');
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('linkSection').classList.toggle('hidden', tab !== 'link');
    document.getElementById('uploadSection').classList.toggle('hidden', tab !== 'upload');
    document.getElementById('tabLinkBtn').className = tab === 'link' ? 'on' : '';
    document.getElementById('tabUploadBtn').className = tab === 'upload' ? 'on' : '';
  }

  function extractYouTubeId(url) {
    const m = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
    return m ? m[1] : null;
  }

  function loadVideoLink() {
    const url = document.getElementById('videoUrlInput').value.trim();
    if (!url) return showStatus('Please paste a valid YouTube or video URL first.', true);
    currentVideoUrl = url;
    uploadedFile = null;
    const ytId = extractYouTubeId(url);
    const html5Player = document.getElementById('html5Player');
    const ytContainer = document.getElementById('ytPlayerContainer');
    document.getElementById('playerPlaceholder').classList.add('hidden');

    if (ytId) {
      isYouTubeUrl = true;
      html5Player.pause();
      html5Player.classList.add('hidden');
      ytContainer.classList.remove('hidden');
      if (ytPlayerInstance && ytPlayerInstance.loadVideoById) {
        ytPlayerInstance.loadVideoById(ytId);
      } else {
        ytPlayerInstance = new YT.Player('ytPlayer', {
          width: '100%', height: '100%', videoId: ytId,
          playerVars: { playsinline: 1 },
          events: { onStateChange: onYtStateChange }
        });
      }
      showStatus('YouTube video loaded! Pick a language and tap Generate captions.', false);
    } else {
      isYouTubeUrl = false;
      ytContainer.classList.add('hidden');
      html5Player.classList.remove('hidden');
      html5Player.src = url;
      html5Player.load();
      showStatus('Video loaded! Tap Generate captions.', false);
    }
  }

  function onYtStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      if (!syncTimer) {
        syncTimer = setInterval(() => {
          if (ytPlayerInstance && ytPlayerInstance.getCurrentTime) updateActiveCaption(ytPlayerInstance.getCurrentTime());
        }, 250);
      }
    } else {
      clearInterval(syncTimer);
      syncTimer = null;
    }
  }

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    uploadedFile = file;
    isYouTubeUrl = false;
    currentVideoUrl = '';
    document.getElementById('fileNameLabel').textContent = `${file.name} (${(file.size / 1048576).toFixed(1)} MB)`;
    const p = document.getElementById('html5Player');
    document.getElementById('ytPlayerContainer').classList.add('hidden');
    document.getElementById('playerPlaceholder').classList.add('hidden');
    p.classList.remove('hidden');
    p.src = URL.createObjectURL(file);
    p.load();
    showStatus('Video loaded! Ready to generate captions.', false);
  }

  async function callGeminiWithFallback(apiKey, payload) {
    const preferred = document.getElementById('modelSelect').value;
    const models = [preferred, 'gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-3.6-flash', 'gemini-3.1-flash-lite', 'gemini-3-flash-preview']
      .filter((v, i, a) => a.indexOf(v) === i);
    let lastError = '';
    for (const modelName of models) {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.error) return { data, usedModel: modelName };
      lastError = data.error.message || 'Unknown API error';
      if (data.error.code !== 404 && !lastError.includes('no longer available') && !lastError.includes('not found')) {
        throw new Error(lastError);
      }
    }
    throw new Error(lastError);
  }

  async function startCaptionGeneration() {
    const engine = document.getElementById('engineSelect').value;
    const [langName, langCode] = document.getElementById('languageSelect').value.split('|');

    if (engine === 'speech') { toggleLiveSpeechRecognition(langCode, langName); return; }

    const apiKey = (localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value).trim();
    if (!apiKey) {
      document.getElementById('settingsPanel').classList.remove('hidden');
      return showStatus('Please add your Google API key above, or switch Caption mode to "Live listen".', true);
    }
    if (currentTab === 'upload' && !uploadedFile) return showStatus('Please choose a video file first.', true);
    if (currentTab === 'link' && !currentVideoUrl) return showStatus('Please load a video link first.', true);

    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Analyzing audio...';
    showStatus(`Generating captions in ${langName}... This takes 10–25 seconds.`, false);

    try {
      let parts = [];
      const promptText = `Listen carefully to the speech in this video and generate accurate, time-synced captions translated/transcribed into ${langName}.
Timestamps must be precise to 0.1 second, and each caption should be one short phrase (max about 8 words) that matches exactly when it is spoken.
Return ONLY a valid JSON array of objects in this exact format without markdown fences:
[{"start": 0.0, "end": 3.5, "text": "caption text in ${langName}"}]`;

      if (currentTab === 'upload' && uploadedFile) {
        parts.push({ inlineData: { mimeType: uploadedFile.type || 'video/mp4', data: await fileToBase64(uploadedFile) } });
      } else if (isYouTubeUrl) {
        parts.push({ fileData: { mimeType: 'video/mp4', fileUri: currentVideoUrl } });
      } else {
        const res = await fetch(currentVideoUrl);
        const blob = await res.blob();
        parts.push({ inlineData: { mimeType: blob.type || 'video/mp4', data: await fileToBase64(blob) } });
      }
      parts.push({ text: promptText });

      const { data } = await callGeminiWithFallback(apiKey, {
        contents: [{ parts }],
        generationConfig: { responseMimeType: 'application/json' }
      });

      const rawJson = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
      rawCaptions = JSON.parse(rawJson.replace(/```json|```/g, '').trim());
      applyChunking();
      showStatus(`✅ Generated ${captionsData.length} captions in ${langName}! Play the video to view.`, false);
    } catch (err) {
      showStatus('Error: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ Generate captions';
    }
  }

  function toggleLiveSpeechRecognition(langCode, langName) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return showStatus('Live listen works only in Chrome / Edge browsers.', true);

    if (isListening && recognition) {
      recognition.stop();
      isListening = false;
      document.getElementById('generateBtn').textContent = '✨ Generate captions';
      showStatus('Stopped live captions.', false);
      return;
    }

    recognition = new SR();
    recognition.lang = langCode;
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('generateBtn').textContent = '🛑 Stop live captions';
      document.getElementById('liveCaptionOverlay').classList.remove('hidden');
      showStatus(`🎙️ Listening in ${langName}... Play your video out loud!`, false);
    };

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          const t = getCurrentVideoTime();
          rawCaptions.push({ start: Math.max(0, t - 3), end: t, text: transcript.trim() });
          applyChunking();
        } else {
          interim += transcript;
        }
      }
      if (interim) {
        document.getElementById('liveCaptionOverlay').classList.remove('hidden');
        document.getElementById('liveCaptionText').textContent = interim;
      }
    };

    recognition.start();
  }

  function getCurrentVideoTime() {
    if (isYouTubeUrl && ytPlayerInstance && ytPlayerInstance.getCurrentTime) return ytPlayerInstance.getCurrentTime();
    return document.getElementById('html5Player').currentTime || 0;
  }

  function updateActiveCaption(t) {
    const overlay = document.getElementById('liveCaptionOverlay');
    const active = captionsData.find(c => t >= c.start && t <= c.end);
    if (active) {
      overlay.classList.remove('hidden');
      document.getElementById('liveCaptionText').textContent = active.text;
    } else if (!isListening) {
      overlay.classList.add('hidden');
    }
  }

  // Re-split the AI captions into N words per line, spreading time by word length.
  // Runs instantly when the selector changes, so no need to regenerate.
  function applyChunking() {
    const n = parseInt(document.getElementById('chunkSelect').value, 10);
    if (!n) {
      captionsData = rawCaptions.map(c => ({ ...c }));
    } else {
      captionsData = [];
      rawCaptions.forEach(seg => {
        const text = String(seg.text || '').trim();
        if (!text) return;
        const spaced = text.split(/\s+/);
        let tokens = spaced;
        if (spaced.length === 1 && text.length > n * 3) tokens = text.match(new RegExp('.{1,' + (n * 3) + '}', 'gu'));
        const joiner = spaced.length === 1 ? '' : ' ';
        const groups = [];
        for (let i = 0; i < tokens.length; i += n) groups.push(tokens.slice(i, i + n).join(joiner));
        const total = groups.reduce((s, g) => s + g.length + 1, 0);
        const dur = Math.max(0, seg.end - seg.start);
        let t = seg.start;
        groups.forEach(g => {
          const d = dur * ((g.length + 1) / total);
          captionsData.push({ start: t, end: t + d, text: g });
          t += d;
        });
      });
    }
    renderCaptionList();
  }

  function formatTimeMs(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toFixed(2).padStart(5, '0');
    return `${m}:${s}`;
  }

  function renderCaptionList() {
    const box = document.getElementById('captionList');
    const stats = document.getElementById('captionStats');
    if (!captionsData.length) {
      box.innerHTML = '<p class="empty">No captions found.</p>';
      stats.classList.add('hidden');
      return;
    }
    const words = rawCaptions.reduce((s, c) => s + String(c.text || '').trim().split(/\s+/).filter(Boolean).length, 0);
    const dur = Math.max(0.1, rawCaptions[rawCaptions.length - 1].end - rawCaptions[0].start);
    stats.textContent = `Lines: ${captionsData.length} · Words: ${words} · Avg: ${(words / dur).toFixed(1)} words/sec`;
    stats.classList.remove('hidden');
    box.innerHTML = captionsData.map(c => {
      const wc = String(c.text).trim().split(/\s+/).filter(Boolean).length;
      return `<div class="cap" onclick="seekTo(${c.start})"><span>${formatTimeMs(c.start)} → ${formatTimeMs(c.end)}<br>${wc} word${wc === 1 ? '' : 's'}</span><p>${c.text}</p></div>`;
    }).join('');
  }

  function seekTo(s) {
    if (isYouTubeUrl && ytPlayerInstance && ytPlayerInstance.seekTo) {
      ytPlayerInstance.seekTo(s, true);
      ytPlayerInstance.playVideo();
    } else {
      const p = document.getElementById('html5Player');
      p.currentTime = s;
      p.play();
    }
  }

  function formatTime(sec) {
    return `${Math.floor(sec / 60).toString().padStart(2, '0')}:${Math.floor(sec % 60).toString().padStart(2, '0')}`;
  }

  function formatSrtTime(sec) {
    const h = Math.floor(sec / 3600).toString().padStart(2, '0');
    const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    const ms = Math.floor((sec % 1) * 1000).toString().padStart(3, '0');
    return `${h}:${m}:${s},${ms}`;
  }

  function copyCaptions() {
    if (!captionsData.length) return;
    navigator.clipboard.writeText(captionsData.map(c => `[${formatTime(c.start)}] ${c.text}`).join('\n'));
    showStatus('Captions copied!', false);
  }

  function downloadSRT() {
    if (!captionsData.length) return;
    const srt = captionsData.map((c, i) => `${i + 1}\n${formatSrtTime(c.start)} --> ${formatSrtTime(c.end)}\n${c.text}\n`).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([srt], { type: 'text/plain;charset=utf-8' }));
    a.download = 'captions.srt';
    a.click();
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  function showStatus(msg, isError) {
    const box = document.getElementById('statusBox');
    box.classList.remove('hidden');
    box.textContent = msg;
    box.className = isError ? 'err' : '';
  }
</script>
</body>
</html>
